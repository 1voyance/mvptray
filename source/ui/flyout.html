<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Mihomo</title>
  <link rel="stylesheet" href="app.css" />
  <style>
    html, body { background: transparent; }
    .fly {
      position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; padding: 14px; height: 100vh;
      border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); overflow: hidden;
      background: #0d0d10;
    }
    .fly > * { flex-shrink: 0; }
    .top { display: flex; align-items: center; gap: 9px; padding-bottom: 2px; }
    .logo { width: 26px; height: 26px; border-radius: 7px; background: #18181c; border: 1px solid var(--border-2); display: grid; place-items: center; }
    .logo svg { width: 14px; height: 14px; stroke: var(--text); }
    .top b { font: 600 13.5px var(--font-display); letter-spacing: -.01em; }
    .main { display: flex; align-items: center; gap: 13px; padding: 12px 13px; }
    .main .power { width: 52px; height: 52px; }
    .main .power svg { width: 20px; height: 20px; }
    .main .power::before { inset: -4px; }
    .main .power::after { inset: -10px; }
    .st { font: 600 15.5px var(--font-display); letter-spacing: -.01em; }
    .st.ok { color: #34d399; } .st.warn { color: #fbbf24; }
    .node { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .node b { color: var(--text); font-weight: 550; }
    .speeds { display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0; overflow: hidden; }
    .speeds .s { padding: 9px 12px 0; position: relative; z-index: 1; }
    .speeds .s small { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 550; display: flex; align-items: center; gap: 5px; }
    .speeds .s small i { width: 6px; height: 6px; border-radius: 2px; }
    .speeds .s b { font: 600 15px var(--font-display); letter-spacing: -.01em; }
    .speeds .g { grid-column: 1 / -1; height: 42px; margin-top: 6px; }
    .add { display: flex; gap: 6px; }
    .add .input { height: 32px; font-size: 12.5px; }
    .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .quick .btn { justify-content: flex-start; height: 34px; font-weight: 500; font-size: 12px; }
    .quick .btn svg { color: var(--muted); }
    .quick .btn:hover svg { color: var(--text); }
    .foot { margin-top: auto; display: flex; justify-content: space-between; padding-top: 4px; border-top: 1px solid var(--border); }
    #toasts { left: 10px; right: 10px; bottom: 10px; }
    .toast { min-width: 0; }
  </style>
</head>
<body>
  <div class="fly">
    <div class="top">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 7 6 11 6-11"/></svg></div>
      <b class="grow">Mihomo VPN</b>
      <span class="chip" id="pill"><span class="dot"></span><span>—</span></span>
    </div>

    <div class="card main">
      <button class="power" id="power" title="Включить / выключить"><span data-icon="power"></span></button>
      <div class="grow" style="min-width:0">
        <div class="st" id="st">—</div>
        <div class="node ellipsis" id="node">&nbsp;</div>
        <div class="node ellipsis hidden" id="game" style="color:#34d399"></div>
      </div>
    </div>

    <div class="card speeds">
      <div class="s"><small><i style="background:var(--ok)"></i>Загрузка</small><b class="num" id="down">0 Б/с</b></div>
      <div class="s" style="text-align:right"><small style="justify-content:flex-end"><i style="background:#71717a"></i>Отдача</small><b class="num" id="up">0 Б/с</b></div>
      <div class="g"><svg class="spark" id="spark"></svg></div>
    </div>

    <div class="seg full" id="mode">
      <button data-mode="rule">Правила</button>
      <button data-mode="global">Всё в VPN</button>
      <button data-mode="direct">Напрямую</button>
    </div>

    <div class="add">
      <input class="input" id="quickDomain" placeholder="Сайт в VPN: example.com" />
      <button class="btn primary icon" id="quickAdd" title="Добавить в VPN" style="width:32px;height:32px"><span data-icon="plus"></span></button>
    </div>

    <div class="quick">
      <button class="btn" data-nav="rules"><span data-icon="list"></span>Мои правила</button>
      <button class="btn" data-nav="sites:broken"><span data-icon="help"></span>Не открывается?</button>
      <button class="btn" data-nav="rules:add-process"><span data-icon="cpu"></span>Программа</button>
      <button class="btn" data-nav="overview"><span data-icon="home"></span>Открыть окно</button>
    </div>

    <div class="foot">
      <button class="btn sm ghost" data-nav="settings"><span data-icon="settings"></span>Настройки</button>
      <button class="btn sm ghost" id="quit"><span data-icon="logout"></span>Выход</button>
    </div>
  </div>
  <div id="toasts"></div>
  <script src="common.js"></script>
  <script src="flyout.js"></script>
</body>
</html>
