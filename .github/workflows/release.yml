# Сборка и публикация новой версии трея.
# Как выпустить версию: поднять version в source/src-tauri/Cargo.toml и tauri.conf.json,
# закоммитить и отправить тег:  git tag v2.4.0 && git push origin v2.4.0
# Трей у всех пользователей увидит новый релиз и предложит обновиться.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri

      - name: Версия в тэге совпадает с Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $ver = (Select-String -Path source/src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -ne $tag) { throw "Тег v$tag, а в Cargo.toml версия $ver" }
          "VERSION=$ver" >> $env:GITHUB_ENV

      - name: Тесты
        working-directory: source/src-tauri
        run: cargo test --release

      - name: Сборка
        working-directory: source/src-tauri
        run: cargo build --release

      - name: Архив для новой установки
        run: |
          New-Item -ItemType Directory -Force dist/tray-rs | Out-Null
          Copy-Item source/src-tauri/target/release/mihomo-tray.exe dist/
          Copy-Item source/src-tauri/target/release/mihomo-tray.exe, README.md, autostart.ps1, install-autostart.bat, uninstall-autostart.bat dist/tray-rs/
          Compress-Archive -Path dist/tray-rs -DestinationPath "dist/mihomo-tray-${{ github.ref_name }}.zip"

      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/mihomo-tray.exe "dist/mihomo-tray-${{ github.ref_name }}.zip" `
            --title "Mihomo Tray ${{ github.ref_name }}" --generate-notes
